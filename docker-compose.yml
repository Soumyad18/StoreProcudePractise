services:
  postgres:
    image: postgres:16
    container_name: store-procedure-practice-postgres
    environment:
      POSTGRES_DB: store_practice
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d store_practice"]
      interval: 10s
      timeout: 5s
      retries: 10
